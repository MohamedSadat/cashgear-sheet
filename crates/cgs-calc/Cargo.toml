[package]
name = "cgs-calc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Exact pins: the engine changes quickly, and a new release can change results. The root
# Cargo.toml takes these from our fork, which carries the patches listed in docs/phase1-report.md.
[dependencies]
cgs-numfmt = { path = "../cgs-numfmt" }
cgs-refs = { path = "../cgs-refs" }
formualizer-workbook = { version = "=0.13.0", default-features = false, features = ["system-clock"] }
formualizer-eval = { version = "=0.13.0", default-features = false, features = ["system-clock"] }
formualizer-common = "=4.1.0"
formualizer-parse = "=4.1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
# The browser needs a JS clock and JS entropy, or the first evaluation panics.
formualizer-workbook = { version = "=0.13.0", default-features = false, features = ["system-clock", "js-runtime"] }
formualizer-eval = { version = "=0.13.0", default-features = false, features = ["system-clock", "js-runtime"] }

[package]
name = "cgs-bench"
description = "Phase 1 bake-off: runs test workbooks through the formula engines. Never ships."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["formualizer", "ironcalc"]
formualizer = ["cgs-calc/formualizer"]
ironcalc = ["cgs-calc/ironcalc"]
# Each engine's own xlsx importer, to tell adapter bugs from engine gaps.
own-loaders = ["formualizer", "ironcalc", "dep:ironcalc", "dep:formualizer-workbook", "dep:formualizer-eval"]

[[bin]]
name = "own-loader"
required-features = ["own-loaders"]

[dependencies]
cgs-calc = { path = "../../crates/cgs-calc" }
quick-xml = "0.39"
serde.workspace = true
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
ironcalc = { version = "=0.9.1", optional = true }
formualizer-workbook = { version = "=0.13.0", default-features = false, features = ["system-clock", "xlsx-recalc"], optional = true }
formualizer-eval = { version = "=0.13.0", default-features = false, features = ["system-clock"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: License gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: pnpm install --frozen-lockfile
      - name: cargo-deny (licenses and sources)
        run: pnpm deny
      - name: cargo-deny (advisories, informational)
        run: cargo deny check advisories
        continue-on-error: true
      - run: pnpm licenses:check
      - name: GPL dependencies fail both gates
        run: pnpm licenses:selftest

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Ensure WebView2 Runtime
        run: ./scripts/setup-webview2.ps1
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      # The generated engine bindings and apps/web/dist are untracked; build them
      # before clippy (Tauri embeds dist), typecheck and the browser tests.
      - run: pnpm build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p cgs-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # Saves the fixtures, and compares them with their sources and the Open XML SDK. Excel
      # isn't on the runner, so the COM-open matrix runs on the reference machine.
      - run: pnpm test:save
      # Diagnostic (Phase 17), removed once known: the PWA's Open with test alone, before the
      # suite, tells whether what runs before it there is why it fails on CI.
      - name: PWA spec alone (diagnostic A)
        run: pnpm exec playwright test tests/e2e/pwa.spec.ts --project=chrome --retries=0 --output=test-results-alone/a
        continue-on-error: true
      - name: ERP commit tests, then Open with (diagnostic B)
        run: pnpm exec playwright test tests/e2e/erp.spec.ts tests/e2e/pwa.spec.ts --project=chrome -g "committing ERP data|Open with" --retries=0 --output=test-results-alone/b
        continue-on-error: true
      - name: ERP spec, then PWA spec (diagnostic C)
        run: pnpm exec playwright test tests/e2e/erp.spec.ts tests/e2e/pwa.spec.ts --project=chrome --retries=0 --output=test-results-alone/c
        continue-on-error: true
      # Browser tests use the runner's installed Chrome and Edge.
      - run: pnpm test:e2e
      - run: pnpm --filter @cgs/desktop build
      - run: pnpm desktop:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-verification
          path: |
            bench/results/
            playwright-report/
            test-results/
            test-results-alone/

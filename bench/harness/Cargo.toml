[package]
name = "cgs-bench"
description = "Phase 1 bake-off: runs test workbooks through the formula engines. Never ships."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cgs-calc = { path = "../../crates/cgs-calc" }
cgs-model = { path = "../../crates/cgs-model" }
cgs-refs = { path = "../../crates/cgs-refs" }
cgs-xlsx = { path = "../../crates/cgs-xlsx" }
quick-xml = "0.39"
serde.workspace = true
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

# Test tools, which never ship: an independent reader to compare with.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
calamine = "0.34"

[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri", "bench/harness", "bench/size-probe"]
# Plain `cargo build` skips the Tauri shell; `--workspace` includes it.
default-members = [
  "crates/cgs-model",
  "crates/cgs-calc",
  "crates/cgs-numfmt",
  "crates/cgs-refs",
  "crates/cgs-xlsx",
  "crates/cgs-pivot",
  "crates/cgs-engine",
  "crates/cgs-wasm",
  "crates/cgs-native",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "LicenseRef-CashGear-Proprietary"
publish = false
rust-version = "1.99.1"

[workspace.dependencies]
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
cgs-model = { path = "crates/cgs-model" }
cgs-engine = { path = "crates/cgs-engine" }
cgs-native = { path = "crates/cgs-native" }

# The engines with the Phase 1 patches, each at an exact commit of a fork. See
# docs/decisions.md. A new upstream release is taken by rebasing the fork on it.
[patch.crates-io]
formualizer-common = { git = "https://github.com/MohamedSadat/formualizer", rev = "7efd060e492d8af36c739a639396a1549a376371" }
formualizer-eval = { git = "https://github.com/MohamedSadat/formualizer", rev = "7efd060e492d8af36c739a639396a1549a376371" }
formualizer-macros = { git = "https://github.com/MohamedSadat/formualizer", rev = "7efd060e492d8af36c739a639396a1549a376371" }
formualizer-parse = { git = "https://github.com/MohamedSadat/formualizer", rev = "7efd060e492d8af36c739a639396a1549a376371" }
formualizer-workbook = { git = "https://github.com/MohamedSadat/formualizer", rev = "7efd060e492d8af36c739a639396a1549a376371" }
ironcalc = { git = "https://github.com/MohamedSadat/IronCalc", rev = "c91da932ddf8c1db11076f3e2830efdfb7a1e724" }
ironcalc_base = { git = "https://github.com/MohamedSadat/IronCalc", rev = "c91da932ddf8c1db11076f3e2830efdfb7a1e724" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# For iterating on the bench harness. Numbers that count come from release builds.
[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
panic = "unwind"
